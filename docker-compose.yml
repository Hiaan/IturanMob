# =============================================================================
# Finance AI — stack completa
#
#   docker compose up -d --build          → postgres, redis, migrate, web, worker
#   docker compose --profile whisper up -d → + servidor de transcrição local (opcional)
#   docker compose --profile ollama up -d  → + LLM local compatível com OpenAI (opcional)
#
# Configure o arquivo .env antes (cp .env.example .env && pnpm run setup).
# Segredos NUNCA ficam neste arquivo: todos vêm do .env.
# =============================================================================
name: finance-ai

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-finance_ai}?schema=public
  REDIS_URL: redis://redis:6379
  NODE_ENV: production
  STORAGE_DIR: /data/storage
  BACKUP_DIR: /data/backups

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-finance_ai}
      TZ: America/Recife
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Não expõe a porta do banco para fora da rede interna por padrão.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Aplica as migrations e encerra (web e worker só sobem depois dele).
  migrate:
    build:
      context: .
      target: worker
    image: finance-ai-worker:latest
    env_file: .env
    environment: *app-env
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: web
    image: finance-ai-web:latest
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - storage:/data/storage
      - backups:/data/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Processo único: WhatsApp, filas, tarefas periódicas e backups. NÃO escale para mais de 1 réplica
  # (uma sessão de WhatsApp não pode ser aberta por dois processos ao mesmo tempo).
  worker:
    image: finance-ai-worker:latest
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    volumes:
      - storage:/data/storage
      - backups:/data/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 35s

  # ---- Opcionais -------------------------------------------------------------
  # Transcrição própria (faster-whisper, compatível com a API da OpenAI): o áudio não sai do servidor.
  # Imagem pequena feita aqui (docker/whisper): CPU, int8, beam 1, idioma pt, 1 thread, uma
  # transcrição por vez, prioridade baixa (nice + cpu_shares) e limites fixos de memória e CPU —
  # pensado para dividir um servidor de 4 GB com outros serviços sem prejudicá-los.
  # Ligar: `docker compose --profile whisper up -d --build` e, no .env:
  #   TRANSCRIPTION_PROVIDER=openai_compatible
  #   TRANSCRIPTION_BASE_URL=http://whisper:8000/v1
  #   WHISPER_MODEL=base          # padrão; "small" transcreve melhor mas pede ~1,5 GB (tabela no README)
  #   WHISPER_MEM_LIMIT=900m      # small: 1500m
  # O modelo é baixado no PRIMEIRO áudio (base ≈ 145 MB, small ≈ 480 MB) e fica no volume
  # whisper-cache; nada é baixado na partida. Para baixar antes:
  #   docker compose --profile whisper run --rm whisper python server.py --download
  # Sem uso por WHISPER_IDLE_UNLOAD_SECONDS (padrão 600 s), o modelo sai da memória; o próximo áudio
  # carrega de novo (alguns segundos a mais).
  # Host privado (rede interna do Docker): não exige o consentimento de envio externo.
  # Nenhuma porta é publicada — só o web/worker alcançam o serviço pela rede interna.
  whisper:
    profiles: ["whisper"]
    build: ./docker/whisper
    image: finance-ai-whisper:local
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: "1"
      WHISPER_BEAM_SIZE: "1"
      WHISPER_LANGUAGE: pt
      WHISPER_IDLE_UNLOAD_SECONDS: ${WHISPER_IDLE_UNLOAD_SECONDS:-600}
      # Um pouco acima do limite do worker (TRANSCRIPTION_MAX_SECONDS=300), que avisa antes.
      WHISPER_MAX_AUDIO_SECONDS: "330"
      LOG_LEVEL: info
    volumes:
      - whisper-cache:/models
    # Memória e CPU fixas: o serviço nunca passa disso (sem swap) e nunca usa os 2 núcleos.
    mem_limit: ${WHISPER_MEM_LIMIT:-900m}
    memswap_limit: ${WHISPER_MEM_LIMIT:-900m}
    cpus: ${WHISPER_CPUS:-1.0}
    # Prioridade baixa: na disputa de CPU, os outros serviços vêm primeiro; sob falta de memória,
    # o kernel encerra o whisper antes deles (ele reinicia sozinho).
    cpu_shares: 256
    oom_score_adj: 800
    healthcheck:
      # Só verifica o servidor (não carrega nem baixa o modelo).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  # LLM local (Ollama) acessível como provedor "Compatível com OpenAI":
  # OPENAI_COMPATIBLE_BASE_URL=http://ollama:11434/v1
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  redisdata:
  storage:
  backups:
  whisper-cache:
  ollama:
